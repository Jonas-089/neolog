{% extends "definitionen/base.html" %}
{% load crispy_forms_tags %}
{% block content %}
    <div class="content-section">
      <div class="media">
        <div class="media-body">
          <h2 class="account-heading">{{ user.username }}</h2>
          <p class="text-secondary">
              Mitglied seit: {{ user.date_joined.day }}.{{ user.date_joined.month }}.{{ user.date_joined.year }}
          </p>
        </div>
      </div>
      <form method="POST">
        {% csrf_token %}

        <fieldset class="form-group">
            <legend class="border-bottom mb-4">Profil bearbeiten</legend>
            {{ u_form|crispy }}
        </fieldset>

        <div class="form-group">
            <button class="btn btn-outline-info" type="submit">Profil aktualisieren</button>
        </div>

      </form>
    </div>
{% endblock content %}
